  deploy_testing:
    name: 🚀 Deploy Test
    needs: [lint, unit_test] # e2e_journey dropped while it's commented out above
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Deploy Frontend to Vercel (Test Environment)
        working-directory: ./web
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN is not set in GitHub Environment 'development'."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Secret VERCEL_ORG_ID is not set in GitHub Environment 'development'."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret VERCEL_PROJECT_ID is not set in GitHub Environment 'development'."
            exit 1
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: /api/v1
      - name: Summary
        run: |
          {
            echo "### Web Environment Deployed to Testing"
            echo ""
            echo "| Service | URL |"
            echo "| --- | --- |"
            echo "| Frontend URL (Vercel) | https://test1.threadops.in |"
          } >> "$GITHUB_STEP_SUMMARY"

  build_push_image:
    name: 📦 Docker Image
    needs: [lint, unit_test] # e2e_journey dropped while it's commented out above
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          target: prod
          push: true
          tags: ghcr.io/threadops/threadops-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Frontend Image Published"
            echo ""
            echo "\`ghcr.io/threadops/threadops-frontend:${{ github.sha }}\`"
            echo ""
            echo "Waiting at the \`deploy_prod\` job for a Review Deployments approval"
            echo "against the \`production\` environment before this SHA goes live."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_prod:
    name: 🚀 Deploy Prod
    needs: [build_push_image, deploy_testing]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewers on this environment are what makes the pipeline pause
    # here and wait for a "Review Deployments" approval before continuing.
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN || 'app.threadops.in' }}
    permissions:
      contents: read
      packages: write
    env:
      FRONTEND_REPO: ghcr.io/threadops/threadops-frontend
      # The image build_push_image just pushed in this same run — no need to
      # re-resolve or re-verify a SHA the way the old standalone promotion
      # workflow did, since deploy_prod only runs after that job succeeded.
      SHA: ${{ github.sha }}
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot current frontend :production as :production-previous
        run: |
          if docker manifest inspect "${FRONTEND_REPO}:production" > /dev/null 2>&1; then
            docker buildx imagetools create --tag "${FRONTEND_REPO}:production-previous" "${FRONTEND_REPO}:production"
            echo "Snapshotted ${FRONTEND_REPO}:production -> ${FRONTEND_REPO}:production-previous"
          else
            echo "No existing ${FRONTEND_REPO}:production tag — first deploy, nothing to snapshot."
          fi

      - name: Retag frontend :production -> ${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "${FRONTEND_REPO}:production" "${FRONTEND_REPO}:${SHA}"
          echo "### Promoting frontend ${SHA} to production" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Coolify deploy (Frontend-PROD)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::error::Secret COOLIFY_WEBHOOK_FRONTEND is not set in GitHub Environment 'production'."
            exit 1
          fi
          if [ -n "$COOLIFY_TOKEN" ]; then
            curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}"
          else
            curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK"
          fi
          echo "Coolify deployment triggered successfully."

      - name: Summary
        run: |
          {
            echo "### ✅ Frontend Production Deployed to Coolify"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${SHA}\` |"
            echo "| Frontend image | \`${FRONTEND_REPO}:production\` (-> ${SHA}) |"
            echo "| Target resource | Coolify \`Frontend-PROD\` |"
            echo "| Status | Webhook triggered |"
          } >> "$GITHUB_STEP_SUMMARY"
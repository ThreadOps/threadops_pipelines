name: 0_Frontend_Test

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('{0} ({1})', github.event.client_payload.message, github.event.client_payload.sha)
      || github.workflow }}

# Validates frontend code, runs E2E tests, deploys to Vercel (Testing), and publishes image to GHCR on main.
on:
  repository_dispatch:
    types: [deploy-test]
  workflow_dispatch:


jobs:
  find_latest_version:
    name: 🏷️ Find Latest Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Fetch Version
        id: get_version
        run: |
          git fetch --tags || true
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v1.0.0-${GITHUB_SHA:0:7}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest Version: ${VERSION}"

  lint:
    name: 🧹 Lint & Typecheck
    needs: find_latest_version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - name: Install Dependencies
        working-directory: ./web
        run: npm ci
      - name: Typecheck
        working-directory: ./web
        run: npm run typecheck
      - name: Lint
        working-directory: ./web
        run: npm run lint

  unit_test:
    name: 🧪 Unit Tests
    needs: find_latest_version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - name: Install Dependencies
        working-directory: ./web
        run: npm ci
      - name: Run Unit Tests
        working-directory: ./web
        run: npm run test
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 7
          if-no-files-found: ignore


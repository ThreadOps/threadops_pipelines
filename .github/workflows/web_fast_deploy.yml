name: 2_Frontend_Fast_Deploy

run-name: Fast deploy frontend (${{ inputs.ref || 'main' }})

# Fast-track manual deployment for frontend:
# 1. Skips lint, typecheck, and unit tests.
# 2. Deploys directly to Vercel Test Environment (test1.threadops.in).
# 3. Builds and pushes the Docker image to GHCR.
# 4. Pauses at the Production Approval Gate.
# 5. On approval, deploys to Cloudflare Pages (Production).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ThreadOps branch, tag or commit SHA to deploy'
        required: true
        default: 'main'

concurrency:
  group: frontend-fast-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find_version:
    name: 🏷️ Find Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      sha: ${{ steps.get_version.outputs.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Fetch Version
        id: get_version
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          git fetch --tags || true
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v1.0.0-${SHA:0:7}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest Version: ${VERSION}"

  deploy_testing:
    name: 🚀 Deploy Test (Vercel)
    needs: find_version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          ref: ${{ needs.find_version.outputs.sha }}

      - name: Deploy Frontend to Vercel (Test Environment)
        working-directory: ./web
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN is not set in GitHub Environment 'development'."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Secret VERCEL_ORG_ID is not set in GitHub Environment 'development'."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret VERCEL_PROJECT_ID is not set in GitHub Environment 'development'."
            exit 1
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: /api/v1

      - name: Summary
        run: |
          {
            echo "### 🚀 Frontend Test Environment Deployed"
            echo ""
            echo "| Service | URL |"
            echo "| --- | --- |"
            echo "| Frontend URL (Vercel) | https://test1.threadops.in |"
          } >> "$GITHUB_STEP_SUMMARY"

  build_push_image:
    name: 📦 Docker Image
    needs: [find_version, deploy_testing]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.find_version.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          target: prod
          push: true
          tags: ghcr.io/threadops/threadops-frontend:${{ needs.find_version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_production:
    name: 🚀 Deploy Production (Cloudflare Pages)
    needs: [find_version, deploy_testing, build_push_image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN || 'app.threadops.in' }}
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ needs.find_version.outputs.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: web
        env:
          VITE_API_URL: https://api.threadops.in/api/v1
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=threadops-frontend --branch=main --commit-hash=${{ env.SHA }}

      - name: Summary
        run: |
          {
            echo "### ✅ Frontend Production Deployed to Cloudflare Pages"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${SHA}\` |"
            echo "| Target | Cloudflare Pages \`threadops-frontend\` |"
            echo "| Status | Successfully uploaded |"
          } >> "$GITHUB_STEP_SUMMARY"

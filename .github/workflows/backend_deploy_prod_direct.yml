name: 1_Backend_Deploy_Prod_Direct

run-name: Backend direct prod deploy (${{ inputs.ref }})

# Manual escape hatch: builds the given ThreadOps ref and ships it straight to Coolify Backend-PROD.
# Skips tests, the testing deploy and the production approval gate — use 0_Backend_Test for the gated path.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ThreadOps branch, tag or commit SHA to deploy'
        required: true
        default: 'main'

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy_prod_direct:
    name: 🚀 Deploy Prod (direct)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No required reviewers on this environment, so the job never pauses for approval.
    environment:
      name: production-direct
      url: https://${{ vars.PROD_DOMAIN || 'app.threadops.in' }}
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_REPO: ghcr.io/threadops/threadops-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.ref }}

      - name: Resolve SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ${{ env.BACKEND_REPO }}:${{ steps.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Snapshot current backend :production as :production-previous
        run: |
          if docker manifest inspect "${BACKEND_REPO}:production" > /dev/null 2>&1; then
            docker buildx imagetools create --tag "${BACKEND_REPO}:production-previous" "${BACKEND_REPO}:production"
          else
            echo "No existing ${BACKEND_REPO}:production tag — first deploy, nothing to snapshot."
          fi

      - name: Retag backend :production
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: docker buildx imagetools create --tag "${BACKEND_REPO}:production" "${BACKEND_REPO}:${SHA}"

      - name: Trigger Coolify deploy (Backend-PROD)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::error::Secret COOLIFY_WEBHOOK_BACKEND is not available to environment 'production-direct'."
            exit 1
          fi
          if [ -n "$COOLIFY_TOKEN" ]; then
            curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}"
          else
            curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK"
          fi

      - name: Summary
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          {
            echo "### ⚡ Backend Deployed Directly to Production (no tests, no approval)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${SHA}\` |"
            echo "| Backend image | \`${BACKEND_REPO}:production\` (-> ${SHA}) |"
            echo "| Rollback tag | \`${BACKEND_REPO}:production-previous\` |"
            echo "| Target resource | Coolify \`Backend-PROD\` |"
          } >> "$GITHUB_STEP_SUMMARY"

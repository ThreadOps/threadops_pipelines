name: 0_Backend_Test

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('{0} ({1})', github.event.client_payload.message, github.event.client_payload.sha)
      || github.workflow }}

on:
  repository_dispatch:
    types: [deploy-backend-test]
  workflow_dispatch:


jobs:
  find_latest_version:
    name: 🏷️ Find Latest Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      sha: ${{ steps.get_version.outputs.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.client_payload.sha || 'main' }}
      - name: Fetch Version
        id: get_version
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          git fetch --tags || true
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v1.0.0-${SHA:0:7}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest Version: ${VERSION}"

  test_and_coverage:
    name: 🧪 Test & Coverage
    needs: find_latest_version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.find_latest_version.outputs.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Tests and Coverage (verify)
        working-directory: ./backend
        run: ./mvnw verify
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Failsafe Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failsafe-reports
          path: backend/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/api-*.jar
          retention-days: 1

  deploy_testing:
    name: 🚀 Deploy Test
    needs: [find_latest_version, test_and_coverage]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      TESTING_HEALTH_URL: https://test-api.threadops.in/actuator/health
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.find_latest_version.outputs.sha }}

      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./dist

      - name: Deploy JAR to Oracle Cloud Test Server
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          HOST: ${{ secrets.TEST_SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no ./dist/api-*.jar ubuntu@$HOST:/home/ubuntu/threadops/app.jar
          ssh -o StrictHostKeyChecking=no ubuntu@$HOST "cd /home/ubuntu/threadops && sudo docker compose up -d --build"

      - name: Wait for testing to report healthy
        run: |
          elapsed=0
          until curl --fail --silent --max-time 10 "$TESTING_HEALTH_URL" | grep -q '"status":"UP"'; do
            if [ "$elapsed" -ge 300 ]; then
              echo "::error::Testing did not report healthy at ${TESTING_HEALTH_URL} within 300s."
              exit 1
            fi
            sleep 10
            elapsed=$((elapsed + 10))
          done
          echo "Testing healthy after ${elapsed}s."

      - name: Summary
        run: |
          {
            echo "### Backend Testing Environment Deployed"
            echo ""
            echo "| Service | URL |"
            echo "| --- | --- |"
            echo "| Backend URL | https://test-api.threadops.in |"
          } >> "$GITHUB_STEP_SUMMARY"

  build_push_image:
    name: 📦 Docker Image
    needs: [find_latest_version, test_and_coverage]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.find_latest_version.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ghcr.io/threadops/threadops-backend:${{ needs.find_latest_version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Backend Image Published"
            echo ""
            echo "\`ghcr.io/threadops/threadops-backend:${{ needs.find_latest_version.outputs.sha }}\`"
            echo ""
            echo "Waiting at the \`deploy_prod\` job for a Review Deployments approval"
            echo "against the \`production\` environment before this SHA goes live."
          } >> "$GITHUB_STEP_SUMMARY"

  production_gate:
    name: 🛡️ Production Approval Gate
    needs: [find_latest_version, test_and_coverage, deploy_testing, build_push_image]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN || 'app.threadops.in' }}
    steps:
      - name: Gate Approved
        run: echo "Production deployment approved. Deploying to Primary VPS and Standby Backup in parallel."

  deploy_production:
    name: 🚀 Deploy Production
    needs: [find_latest_version, production_gate, build_push_image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_REPO: ghcr.io/threadops/threadops-backend
      SHA: ${{ needs.find_latest_version.outputs.sha }}
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot current backend :production as :production-previous
        run: |
          if docker manifest inspect "${BACKEND_REPO}:production" > /dev/null 2>&1; then
            docker buildx imagetools create --tag "${BACKEND_REPO}:production-previous" "${BACKEND_REPO}:production"
            echo "Snapshotted ${BACKEND_REPO}:production -> ${BACKEND_REPO}:production-previous"
          else
            echo "No existing ${BACKEND_REPO}:production tag — first deploy, nothing to snapshot."
          fi

      - name: Retag backend :production -> ${{ needs.find_latest_version.outputs.sha }}
        run: |
          docker buildx imagetools create --tag "${BACKEND_REPO}:production" "${BACKEND_REPO}:${SHA}"
          echo "### Promoting backend ${SHA} to production" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Coolify deploy (Backend-PROD)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::error::Secret COOLIFY_WEBHOOK_BACKEND is not set in GitHub repository secrets."
            exit 1
          fi
          if [ -n "$COOLIFY_TOKEN" ]; then
            curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}"
          else
            curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK"
          fi
          echo "Coolify deployment triggered successfully."

      - name: Summary
        run: |
          {
            echo "### ✅ Backend Production Deployed (Coolify Primary)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${SHA}\` |"
            echo "| Backend image | \`${BACKEND_REPO}:production\` (-> ${SHA}) |"
            echo "| Target resource | Coolify \`Backend-PROD\` |"
            echo "| Status | Webhook triggered |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_backup:
    name: 🚀 Deploy Backup
    needs: [find_latest_version, production_gate, test_and_coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKUP_SERVER_HOST: ${{ secrets.BACKUP_SERVER_HOST || vars.BACKUP_SERVER_HOST || '129.225.95.28' }}
      SHA: ${{ needs.find_latest_version.outputs.sha }}
    steps:
      - name: Download Backend JAR for Backup Standby
        if: env.BACKUP_SERVER_HOST != ''
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./dist-backup

      - name: Deploy JAR to Oracle Cloud Backup Standby Server
        if: env.BACKUP_SERVER_HOST != ''
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          HOST: ${{ env.BACKUP_SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no ./dist-backup/api-*.jar ubuntu@$HOST:/home/ubuntu/threadops/app.jar
          ssh -o StrictHostKeyChecking=no ubuntu@$HOST "cd /home/ubuntu/threadops && sudo docker compose up -d --build"

      - name: Summary
        run: |
          {
            echo "### ✅ Backend Backup Deployed (Oracle Standby)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${SHA}\` |"
            echo "| Host | \`${BACKUP_SERVER_HOST}\` |"
            echo "| Status | Docker container rebuilt & healthy |"
          } >> "$GITHUB_STEP_SUMMARY"

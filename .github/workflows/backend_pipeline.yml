name: 0_Backend_Test

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'backend/**'
  #     - '.github/workflows/backend_pipeline.yml'
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - 'backend/**'
  #     - '.github/workflows/backend_pipeline.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  find_latest_version:
    name: 🏷️ Find Latest Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Fetch Version
        id: get_version
        run: |
          git fetch --tags || true
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v1.0.0-${GITHUB_SHA:0:7}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest Version: ${VERSION}"

  unit_test:
    name: 🧪 Unit Tests
    needs: find_latest_version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: ./mvnw test
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  integration_test:
    name: ⚙️ Integration Tests (Testcontainers)
    needs: find_latest_version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Integration Tests
        working-directory: ./backend
        run: ./mvnw verify
      - name: Upload Failsafe Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failsafe-reports
          path: backend/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  coverage_gate:
    name: 🛡️ Coverage Gate & JaCoCo Verification
    needs: [unit_test, integration_test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: JaCoCo Coverage Check
        working-directory: ./backend
        run: ./mvnw verify
      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  deploy_testing:
    name: 🚀 Deploy Testing
    needs: coverage_gate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      TESTING_HEALTH_URL: https://threadops-cebn.onrender.com/actuator/health
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Trigger Render Deploy (Backend Testing)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK is not set in GitHub Environment 'development'."
            exit 1
          fi
          curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK"
      - name: Wait for testing to report healthy
        run: |
          elapsed=0
          until curl --fail --silent --max-time 10 "$TESTING_HEALTH_URL" | grep -q '"status":"UP"'; do
            if [ "$elapsed" -ge 300 ]; then
              echo "::error::Testing did not report healthy at ${TESTING_HEALTH_URL} within 300s."
              exit 1
            fi
            sleep 10
            elapsed=$((elapsed + 10))
          done
          echo "Testing healthy after ${elapsed}s."
      - name: Summary
        run: |
          {
            echo "### Backend Testing Environment Deployed"
            echo ""
            echo "| Service | URL |"
            echo "| --- | --- |"
            echo "| Backend URL (Render) | https://threadops-cebn.onrender.com |"
          } >> "$GITHUB_STEP_SUMMARY"

  build_push_image:
    name: 📦 Build & Push Backend Image (GHCR)
    needs: coverage_gate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/threadops-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Backend Image Published"
            echo ""
            echo "\`ghcr.io/${{ github.repository_owner }}/threadops-backend:${{ github.sha }}\`"
            echo ""
            echo "Not deployed anywhere yet. Promote to production with a manual"
            echo "\`workflow_dispatch\` run of \`deploy-production-backend.yml\` using this SHA."
          } >> "$GITHUB_STEP_SUMMARY"

name: 0_Backend_Test

on:
  repository_dispatch:
    types: [deploy-test]
  workflow_dispatch:


jobs:
  find_latest_version:
    name: 🏷️ Find Latest Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Fetch Version
        id: get_version
        run: |
          git fetch --tags || true
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v1.0.0-${GITHUB_SHA:0:7}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest Version: ${VERSION}"

  test_and_coverage:
    name: 🧪 Test & Coverage
    needs: find_latest_version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Tests and Coverage (verify)
        working-directory: ./backend
        run: ./mvnw verify
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Failsafe Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-failsafe-reports
          path: backend/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  deploy_testing:
    name: 🚀 Deploy Test
    needs: test_and_coverage
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      TESTING_HEALTH_URL: https://threadops-cebn.onrender.com/actuator/health
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.ref }}
      - name: Trigger Render Deploy (Backend Testing)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK is not set in GitHub Environment 'development'."
            exit 1
          fi
          curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK"
      - name: Wait for testing to report healthy
        run: |
          elapsed=0
          until curl --fail --silent --max-time 10 "$TESTING_HEALTH_URL" | grep -q '"status":"UP"'; do
            if [ "$elapsed" -ge 300 ]; then
              echo "::error::Testing did not report healthy at ${TESTING_HEALTH_URL} within 300s."
              exit 1
            fi
            sleep 10
            elapsed=$((elapsed + 10))
          done
          echo "Testing healthy after ${elapsed}s."
      - name: Summary
        run: |
          {
            echo "### Backend Testing Environment Deployed"
            echo ""
            echo "| Service | URL |"
            echo "| --- | --- |"
            echo "| Backend URL (Render) | https://threadops-cebn.onrender.com |"
          } >> "$GITHUB_STEP_SUMMARY"

  build_push_image:
    name: 📦 Docker Image
    needs: test_and_coverage
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ThreadOps/threadops
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ghcr.io/threadops/threadops-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Backend Image Published"
            echo ""
            echo "\`ghcr.io/threadops/threadops-backend:${{ github.sha }}\`"
            echo ""
            echo "Waiting at the \`deploy_prod\` job for a Review Deployments approval"
            echo "against the \`production\` environment before this SHA goes live."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_prod:
    name: 🚀 Deploy Prod
    needs: [build_push_image, deploy_testing]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewers on this environment are what makes the pipeline pause
    # here and wait for a "Review Deployments" approval before continuing.
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN || 'app.threadops.in' }}
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_REPO: ghcr.io/threadops/threadops-backend
      # The image build_push_image just pushed in this same run — no need to
      # re-resolve or re-verify a SHA the way the old standalone promotion
      # workflow did, since deploy_prod only runs after that job succeeded.
      SHA: ${{ github.sha }}
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot current backend :production as :production-previous
        run: |
          if docker manifest inspect "${BACKEND_REPO}:production" > /dev/null 2>&1; then
            docker buildx imagetools create --tag "${BACKEND_REPO}:production-previous" "${BACKEND_REPO}:production"
            echo "Snapshotted ${BACKEND_REPO}:production -> ${BACKEND_REPO}:production-previous"
          else
            echo "No existing ${BACKEND_REPO}:production tag — first deploy, nothing to snapshot."
          fi

      - name: Retag backend :production -> ${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "${BACKEND_REPO}:production" "${BACKEND_REPO}:${SHA}"
          echo "### Promoting backend ${SHA} to production" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Coolify deploy (Backend-PROD)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::error::Secret COOLIFY_WEBHOOK_BACKEND is not set in GitHub Environment 'production'."
            exit 1
          fi
          if [ -n "$COOLIFY_TOKEN" ]; then
            curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}"
          else
            curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK"
          fi
          echo "Coolify deployment triggered successfully."

      - name: Summary
        run: |
          {
            echo "### ✅ Backend Production Deployed to Coolify"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${SHA}\` |"
            echo "| Backend image | \`${BACKEND_REPO}:production\` (-> ${SHA}) |"
            echo "| Target resource | Coolify \`Backend-PROD\` |"
            echo "| Status | Webhook triggered |"
          } >> "$GITHUB_STEP_SUMMARY"
